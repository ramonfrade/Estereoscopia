<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Estereoscopia — Demo</title>
    <style>
      * { box-sizing: border-box; }
      body {
        font-family: system-ui, sans-serif;
        margin: 0;
        padding: 1.5rem;
        background: #0f172a;
        color: #e2e8f0;
      }
      h1 { margin-top: 0; font-size: 1.4rem; }
      .status { margin-bottom: 1rem; color: #94a3b8; }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
        gap: 1rem;
      }
      figure {
        margin: 0;
        background: #1e293b;
        border-radius: 8px;
        overflow: hidden;
      }
      figcaption {
        padding: 0.5rem 0.75rem;
        font-size: 0.85rem;
        color: #94a3b8;
      }
      img {
        width: 100%;
        display: block;
        background: #000;
        min-height: 180px;
        object-fit: contain;
      }
      .depth {
        font-size: 2rem;
        font-weight: 700;
        color: #4ade80;
        margin: 1rem 0;
      }
      button {
        background: #2563eb;
        color: white;
        border: none;
        padding: 0.6rem 1.2rem;
        border-radius: 6px;
        cursor: pointer;
        font-size: 1rem;
        margin-right: 0.5rem;
        margin-bottom: 1rem;
      }
      button:disabled { opacity: 0.5; cursor: not-allowed; }
      .error { color: #f87171; }
    </style>
  </head>
  <body>
    <h1>Visão Estéreo — Worker Python + TypeScript</h1>
    <p class="status" id="status">Conectando ao worker…</p>
    <p class="depth" id="depth">— cm</p>
    <p class="status" style="font-size:0.9rem">Parado: mede a região central (fique no meio da imagem). Mova o braço/objeto para seguir movimento. Clique para fixar um ponto.</p>
    <button id="toggle">Pausar</button>
    <button id="reset">Modo automático</button>
    <div class="grid">
      <figure>
        <img id="img-left" alt="Câmera esquerda" />
        <figcaption>Esquerda (retificada)</figcaption>
      </figure>
      <figure>
        <img id="img-right" alt="Câmera direita" />
        <figcaption>Direita (retificada)</figcaption>
      </figure>
      <figure>
        <img id="img-disp" alt="Mapa de disparidade" />
        <figcaption>Disparidade</figcaption>
      </figure>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
